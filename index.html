<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Xuoh的个人主页 - 分享技术、生活与创意" />
    <meta name="keywords" content="Xuoh,个人主页,博客,技术分享" />
    <meta name="author" content="Xuoh" />
    <meta name="theme-color" content="#0b0c0f" />
    <!-- 社交分享卡片（Open Graph / Twitter Card） -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Xuoh - 个人主页" />
    <meta property="og:description" content="分享技术、生活与创意" />
    <meta property="og:url" content="https://xu.uy/" />
    <meta property="og:image" content="https://xu.uy/images/x.jpg" />
    <meta property="og:site_name" content="Xuoh" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Xuoh - 个人主页" />
    <meta name="twitter:description" content="分享技术、生活与创意" />
    <meta name="twitter:image" content="https://xu.uy/images/x.jpg" />
    <title>Xuoh - 个人主页</title>
    <link rel="preload" href="./images/bg.webp" as="image" />
    <link rel="preload" href="./images/x.jpg" as="image" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- 加载动画 -->
    <div class="loader" role="status" aria-label="页面加载中">
      <div class="loader-text">Xuoh</div>
      <div class="loader-bar">
        <div class="loader-progress"></div>
      </div>
    </div>

    <!-- 自定义光标：流星拖尾（canvas 轨迹）在下，内点在上 -->
    <canvas class="cursor-trail" aria-hidden="true"></canvas>
    <div class="cursor-dot" aria-hidden="true"></div>

    <!-- 背景图 -->
    <div class="background" aria-hidden="true"></div>

    <!-- 环绕内容的四分之三圆环 -->
    <div class="halo-ring" aria-hidden="true"></div>

    <!-- 胶片颗粒质感层 -->
    <div class="grain" aria-hidden="true"></div>

    <!-- 实时时钟 -->
    <aside class="clock" role="complementary" aria-label="当前时间">
      <time class="clock-time" id="time" datetime="">--:--:--</time>
      <div class="clock-date" id="date">--</div>
    </aside>

    <!-- 导航栏 -->
    <nav class="navbar" role="navigation" aria-label="主导航">
      <button
        class="nav-btn active"
        onclick="navigate('home', event)"
        aria-label="首页"
        aria-current="page"
      >
        首页
      </button>
      <button
        class="nav-btn"
        onclick="navigate('blog', event)"
        aria-label="博客"
      >
        博客
      </button>
      <button
        class="nav-btn"
        onclick="navigate('nav', event)"
        aria-label="导航页"
      >
        导航页
      </button>
    </nav>

    <!-- 主容器 -->
    <main class="container">
      <!-- Logo -->
      <header class="logo-container">
        <div class="logo-wrapper">
          <img
            src="./images/x.jpg"
            alt="Xuoh的头像"
            class="logo"
            draggable="false"
            loading="eager"
            fetchpriority="high"
            decoding="async"
          />
        </div>
        <h1 class="site-name">Xuoh</h1>
      </header>

      <!-- 一言 -->
      <section class="hitokoto-box" aria-label="每日一言">
        <blockquote>
          <p class="hitokoto" id="hitokoto">正在加载一言...</p>
          <footer class="hitokoto-from" id="hitokoto-from"></footer>
        </blockquote>
        <button
          class="refresh-btn"
          onclick="refreshHitokoto()"
          aria-label="刷新一言"
        >
          <span class="refresh-icon" aria-hidden="true">↻</span> 换一句
        </button>
      </section>

      <!-- 社交媒体 -->
      <section class="social-links" aria-label="社交媒体链接">
        <!-- GitHub -->
        <a
          href="https://github.com/xuoh"
          target="_blank"
          rel="noopener noreferrer"
          class="social-btn"
          data-tooltip="GitHub"
          aria-label="访问我的GitHub主页"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
            />
          </svg>
        </a>

        <!-- 哔哩哔哩 -->
        <a
          href="https://space.bilibili.com/"
          target="_blank"
          rel="noopener noreferrer"
          class="social-btn"
          data-tooltip="哔哩哔哩"
          aria-label="访问我的哔哩哔哩主页"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M17.813 4.653h.854c1.51.054 2.769.578 3.773 1.574 1.004.995 1.524 2.249 1.56 3.76v7.36c-.036 1.51-.556 2.769-1.56 3.773s-2.262 1.524-3.773 1.56H5.333c-1.51-.036-2.769-.556-3.773-1.56S.036 18.858 0 17.347v-7.36c.036-1.511.556-2.765 1.56-3.76 1.004-.996 2.262-1.52 3.773-1.574h.774l-1.174-1.12a1.234 1.234 0 0 1-.373-.906c0-.356.124-.658.373-.907l.027-.027c.267-.249.573-.373.92-.373.347 0 .653.124.92.373L9.653 4.44c.071.071.134.142.187.213h4.267a.836.836 0 0 1 .16-.213l2.853-2.747c.267-.249.573-.373.92-.373.347 0 .662.151.929.4.267.249.391.551.391.907 0 .355-.124.657-.373.906zM5.333 7.24c-.746.018-1.373.276-1.88.773-.506.498-.769 1.13-.786 1.894v7.52c.017.764.28 1.395.786 1.893.507.498 1.134.756 1.88.773h13.334c.746-.017 1.373-.275 1.88-.773.506-.498.769-1.129.786-1.893v-7.52c-.017-.765-.28-1.396-.786-1.894-.507-.497-1.134-.755-1.88-.773zM8 11.107c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c0-.373.129-.689.386-.947.258-.257.574-.386.947-.386zm8 0c.373 0 .684.124.933.373.25.249.383.569.4.96v1.173c-.017.391-.15.711-.4.96-.249.25-.56.374-.933.374s-.684-.125-.933-.374c-.25-.249-.383-.569-.4-.96V12.44c.017-.391.15-.711.4-.96.249-.249.56-.373.933-.373Z"
            />
          </svg>
        </a>

        <!-- 邮箱 -->
        <a
          href="mailto:xu_o@qq.com"
          class="social-btn"
          data-tooltip="邮箱"
          aria-label="发送邮件给我"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"
            />
          </svg>
        </a>
      </section>
    </main>

    <!-- 底部信息栏 -->
    <footer class="footer" role="contentinfo">
      <div class="footer-line">©<span id="footer-year">2026</span> By Xuoh</div>
      <div class="footer-line" id="uptime">本站居然运行了 -- 天 -- 小时 -- 分 -- 秒 ❤️</div>
      <div class="footer-line" id="voyager">旅行者 1 号当前距离地球 -- 千米，约为 -- 个天文单位 🚀</div>
    </footer>

    <script src="./main.js" defer></script>
  </body>
</html>
